plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.120'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

// Minecraft 1.21.1 requires Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    validateAccessTransformers = true
    accessTransformers.files.setFrom(file('src/main/resources/META-INF/accesstransformer.cfg'))

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        webdisplays {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url 'https://mcef-download.cinemamod.com/repositories/releases/' }
}

dependencies {
    // MCEF (Chromium) - runtime mod provided separately in the mods folder
    implementation("com.cinemamod:mcef:${mcef_version}") {
        transitive = false
    }

    // Mixin is bundled with NeoForge at runtime; refmaps are obsolete in 1.21+ (official mappings everywhere)
    compileOnly "org.spongepowered:mixin:0.8.7"
}

// jar meta-info
jar {
    manifest {
        attributes([
                "Specification-Title"     : "WebDisplays",
                "Specification-Vendor"    : "CinemaMod Group",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "CinemaMod Group",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "webdisplays.mixins.json"
        ])
    }
}
